[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "p1-dsmr-common"
version = "0.1.0"
description = "Shared compatibility helpers for Home Assistant P1/DSMR integrations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "dsmr-parser>=1.11.1",
]

[project.urls]
Homepage = "https://github.com/chill-uk/p1-dsmr-common"
Repository = "https://github.com/chill-uk/p1-dsmr-common"
Issues = "https://github.com/chill-uk/p1-dsmr-common/issues"

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.14",
  "twine>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
